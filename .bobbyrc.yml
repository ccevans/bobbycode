# Bobby Configuration
# Generated by: npx bobbycode init
# Docs: https://github.com/ccevans/bobbycode

# Project name (used in ticket board headers and PR titles)
project: bobbycode

# Tech stack preset. Determines default commands, areas, and health checks.
# Options: nextjs | rails-react | django | python-flask | go | rust | polyglot | generic
stack: generic

# AI target. Determines where skills/agents/commands are scaffolded.
# Options: claude-code | cursor | cline
target: claude-code

# Directory where Bobby stores tickets, sessions, and metadata.
bobby_dir: .bobby
tickets_dir: .bobby/tickets
sessions_dir: .bobby/sessions

# Prefix for ticket IDs (e.g., TKT-001, PROJ-001)
ticket_prefix: TKT

# Health check URLs verified before agents start work.
# Add your dev server URL(s) so agents can confirm the app is running.
health_checks: []

# Feature areas for categorizing tickets. Used by `bobby ticket create --area`.
areas: []

# Shell commands Bobby uses for dev, test, lint, and build.
commands:
  dev: 
  test: npm test
  lint: npm run lint
  build: 

# Tools available for the test agent (e.g., playwright, curl)
testing_tools:
  - curl

# Max retry loops when review/test rejects code (per ticket)
max_retries: 3

# ──────────────────────────────────────────────────────────
# Optional configuration — uncomment and customize as needed
# ──────────────────────────────────────────────────────────

# Workflows — the ordered stages a ticket runs through. Built-in: default,
# secure, quick. Add or override your own here, then: bobby run <name> <ticket>
# workflows:
#   default: [plan, build, review, test]
#   secure: [plan, build, security, review, test]
#   quick: [plan, build, test]

# Project-specific skills the build agent should follow.
# These are non-bobby skills in your .claude/skills/ directory.
# build_skills:
#   - api-patterns
#   - component-library

# Backlog management
# backlog_limit: 50          # Warn when backlog exceeds this count
# backlog_stale_days: 30     # Days before a ticket is considered stale

# Multi-repo shipping (for monorepo or multi-repo projects)
# repos:
#   - name: api
#     path: backend-api
#   - name: ui
#     path: frontend-ui

# Parallel isolation mode for batch operations
# parallel_isolation: none   # Options: none | worktree

# Git branch naming conventions
# git_conventions:
#   feature_branch_prefix: feature  # Epic branches: feature/{id}-{slug}
#   ticket_branch_prefix: tkt        # Ticket branches: tkt-{id}
#   worktree_prefix: bobby            # Worktree branches: bobby/{id}-{stage}

# Dashboard configuration (bobby dashboard)
# dashboard:
#   port: 7777                       # Web UI port
#   worktree_root: ../bobby-wt       # Where worktrees are created
#   auto_approve_stages: []           # Stages to auto-advance (e.g., [reviewing])
#   executor: claude                  # claude | cursor-agent (default: from target)
#   model: null                       # Passed through as --model. For names,
#                                     # run: cursor-agent --list-models
#   permission_mode: null             # bypassPermissions | acceptEdits | plan
#                                     # Unset = each CLI's own default, which
#                                     # may stop to ask before editing files.

# Conductor.build integration (set to false to skip conductor.json generation)
# conductor: false


# Agents launched by `bobby app` run inside an isolated git worktree, so the
# worktree IS the sandbox. Left unset, claude -p stops to ask before every
# write — and in a headless subprocess nobody can answer, so the agent burns
# turns retrying and exits 0 having written nothing. See TKT-062.
dashboard:
  # bypassPermissions, not acceptEdits: acceptEdits allows file writes but NOT
  # bash, and the whole workflow depends on the agent running `bobby ticket
  # move`. Without bash it hand-edits ticket.md inside its own worktree, which
  # the orchestrator correctly ignores. See TKT-062.
  permission_mode: bypassPermissions
